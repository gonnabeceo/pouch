[project]
name = "pouch"
version = "0.1.0"
description = "Local, encrypted crypto portfolio tracker for public addresses"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlcipher3-wheels>=0.5.4",
    "argon2-cffi>=23.1",
    "pycryptodome>=3.20",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
pouch = "pouch.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pouch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
